<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masonic Jeopardy</title>
<meta name="description" content="Masonic Jeopardy - a Masonic education quiz game for lodge nights.">
<style>
  :root {
    --black: #070707;
    --panel: #121008;
    --panel-2: #1b170a;
    --gold: #d4af37;
    --gold-light: #f6dc82;
    --gold-dark: #8a6d1c;
    --red: #c0392b;
    --green: #4caf50;
    --text: #f1e6c4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--black); color: var(--text);
    font-family: Optima, Candara, "Segoe UI", Georgia, serif; }
  body {
    background:
      radial-gradient(ellipse at 50% -10%, #2a2108 0%, transparent 60%),
      var(--black);
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold-light); outline-offset: 2px; }
  .gold-text {
    background: linear-gradient(180deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ---------- Header ---------- */
  header.top { display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 14px 12px 6px; position: relative; }
  header.top h1 { margin: 0; font-family: Copperplate, "Copperplate Gothic Light", Georgia, serif;
    font-size: clamp(1.6rem, 4.5vw, 3rem); letter-spacing: .12em; text-transform: uppercase; }
  header.top svg { width: clamp(38px, 6vw, 64px); height: auto; flex: none; }
  .top-tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 8px; }
  .icon-btn { background: transparent; color: var(--gold); border: 1px solid var(--gold-dark);
    border-radius: 8px; padding: 6px 10px; font-size: .85rem; }
  .icon-btn:hover { background: var(--panel-2); border-color: var(--gold); }
  .tagline { text-align: center; color: var(--gold-dark); letter-spacing: .25em; font-size: .75rem;
    text-transform: uppercase; margin: 0 0 10px; }

  /* ---------- Setup ---------- */
  .setup { max-width: 560px; margin: 24px auto; padding: 0 16px 40px; }
  .card { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 2px solid var(--gold);
    border-radius: 14px; padding: 22px; box-shadow: 0 0 40px rgba(212,175,55,.12); }
  .card h2 { margin: 0 0 4px; color: var(--gold); letter-spacing: .08em; text-transform: uppercase; font-size: 1.15rem; }
  .card p.sub { margin: 0 0 16px; color: #b9ab7c; font-size: .95rem; }
  .field { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .field label { width: 70px; color: var(--gold); font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; }
  .field input { flex: 1; background: #000; color: var(--gold-light); border: 1px solid var(--gold-dark);
    border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 1.05rem; }
  .row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .btn { background: linear-gradient(180deg, var(--gold-light), var(--gold) 60%, var(--gold-dark));
    color: #120d00; border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; font-size: .95rem; }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
  .btn.ghost:hover { background: var(--panel-2); }
  .btn.danger { background: linear-gradient(180deg, #e0685a, var(--red)); color: #fff; }
  .btn.good { background: linear-gradient(180deg, #7ed17f, #3b8f3e); color: #06200a; }
  .btn[disabled] { opacity: .35; cursor: not-allowed; filter: none; }
  .note { margin-top: 18px; font-size: .8rem; color: #8f8359; line-height: 1.4; }

  /* ---------- Board ---------- */
  main.game { max-width: 1200px; margin: 0 auto; padding: 0 10px 24px; }
  .board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .cat { background: linear-gradient(180deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
    color: #120d00; font-weight: 800; text-transform: uppercase; text-align: center;
    display: flex; align-items: center; justify-content: center; padding: 8px 4px;
    min-height: clamp(54px, 9vw, 92px); border-radius: 6px; letter-spacing: .05em;
    font-size: clamp(.5rem, 1.6vw, 1.1rem); line-height: 1.15; overflow-wrap: break-word; }
  .tile { background: radial-gradient(ellipse at 50% 30%, #1d1708, #0b0904);
    color: var(--gold); border: 2px solid var(--gold-dark); border-radius: 6px;
    min-height: clamp(52px, 10vw, 96px); font-family: Copperplate, Georgia, serif;
    font-weight: 700; font-size: clamp(1.1rem, 3.6vw, 2.5rem);
    text-shadow: 0 0 14px rgba(212,175,55,.35); transition: transform .12s, border-color .12s, box-shadow .12s; }
  .tile:hover:not([disabled]) { border-color: var(--gold-light); transform: translateY(-2px);
    box-shadow: 0 6px 22px rgba(212,175,55,.28); }
  .tile[disabled] { visibility: hidden; }
  .board-actions { display: flex; justify-content: center; gap: 10px; margin: 12px 0 4px; flex-wrap: wrap; }

  /* ---------- Scoreboard ---------- */
  .scores { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .team { flex: 1 1 180px; max-width: 280px; background: var(--panel); border: 2px solid var(--gold-dark);
    border-radius: 10px; padding: 10px 12px; text-align: center; position: relative; }
  .team.control { border-color: var(--gold-light); box-shadow: 0 0 22px rgba(246,220,130,.35); }
  .team .tname { color: var(--gold); font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team .tscore { font-family: Copperplate, Georgia, serif; font-size: clamp(1.4rem, 4vw, 2.2rem); color: var(--gold-light); }
  .team .tscore.neg { color: #ff8a7a; }
  .team .ctl { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--gold);
    color: #120d00; font-size: .65rem; font-weight: 800; letter-spacing: .12em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .adj { display: flex; gap: 6px; justify-content: center; margin-top: 4px; }
  .adj button { background: transparent; color: #8f8359; border: 1px solid #3a3115; border-radius: 6px;
    font-size: .7rem; padding: 2px 8px; }
  .adj button:hover { color: var(--gold); border-color: var(--gold-dark); }
  .pick { color: #8f8359; font-size: .75rem; margin-top: 2px; }
  .pick button { background: none; border: 0; color: var(--gold-dark); text-decoration: underline; font-size: .75rem; padding: 0; }

  /* ---------- Modal ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: flex; align-items: center;
    justify-content: center; padding: 14px; z-index: 50; animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal { width: min(980px, 100%); max-height: 100%; overflow: auto;
    background: radial-gradient(ellipse at 50% 0%, #251c06, #0a0803 70%);
    border: 3px solid var(--gold); border-radius: 16px; padding: clamp(14px, 3vw, 30px);
    box-shadow: 0 0 80px rgba(212,175,55,.25); text-align: center; }
  .m-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--gold);
    text-transform: uppercase; letter-spacing: .12em; font-size: clamp(.75rem, 2vw, 1rem); font-weight: 700; }
  .dd-badge { background: var(--gold); color: #120d00; padding: 4px 12px; border-radius: 999px; font-weight: 900;
    animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { box-shadow: 0 0 22px var(--gold-light); } }
  .clue { font-size: clamp(1.3rem, 4.2vw, 2.7rem); line-height: 1.3; margin: clamp(16px, 4vw, 40px) 0;
    color: var(--gold-light); text-transform: uppercase; letter-spacing: .03em; font-weight: 600; }
  .answer { font-size: clamp(1.1rem, 3.2vw, 2rem); color: #fff; background: rgba(212,175,55,.14);
    border: 1px dashed var(--gold); border-radius: 10px; padding: 12px; margin: 0 0 16px; }
  .timer { height: 8px; background: #241d0a; border-radius: 99px; overflow: hidden; margin: 0 auto 6px; max-width: 520px; }
  .timer > div { height: 100%; width: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold-light)); transition: width 1s linear; }
  .timer-label { color: #8f8359; font-size: .75rem; letter-spacing: .1em; margin-bottom: 12px; }
  .judge { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 10px 0; }
  .judge .jteam { background: var(--panel); border: 1px solid var(--gold-dark); border-radius: 10px; padding: 8px 10px; }
  .judge .jname { color: var(--gold); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
  .judge .jbtns { display: flex; gap: 6px; justify-content: center; }
  .jbtns .btn { padding: 8px 14px; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .wager-box { margin: 24px auto; max-width: 360px; }
  .wager-box input { width: 100%; background: #000; color: var(--gold-light); border: 2px solid var(--gold);
    border-radius: 10px; padding: 12px; font-size: 1.8rem; text-align: center; font-family: Copperplate, Georgia, serif; }
  .wager-hint { color: #8f8359; font-size: .85rem; margin-top: 6px; }
  .big-title { font-family: Copperplate, Georgia, serif; font-size: clamp(1.6rem, 5vw, 3.2rem); letter-spacing: .1em; text-transform: uppercase; margin: 10px 0; }
  .winner { font-size: clamp(1.4rem, 4vw, 2.4rem); margin: 10px 0 18px; color: var(--gold-light); }
  .final-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin: 14px 0; }
  .final-grid .fteam { background: var(--panel); border: 1px solid var(--gold-dark); border-radius: 10px; padding: 10px; }
  .final-grid input { width: 100%; background: #000; color: var(--gold-light); border: 1px solid var(--gold-dark);
    border-radius: 8px; padding: 8px; font-size: 1.2rem; text-align: center; margin-top: 6px; }
  .scoremsg { font-weight: 800; letter-spacing: .06em; text-transform: uppercase; margin: 6px 0 10px; font-size: 1.1rem; }
  .scoremsg.ok { color: var(--green); } .scoremsg.no { color: #ff8a7a; }
  .tag { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; }
  .tag.ok { color: var(--green); } .tag.no { color: #ff8a7a; }

  /* sparkle */
  .spark { position: fixed; top: -10px; width: 8px; height: 8px; background: var(--gold-light); transform: rotate(45deg);
    animation: fall linear forwards; z-index: 60; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .2; } }


  /* ---------- Masonic ornament ---------- */
  .checker { height: 20px; background: repeating-conic-gradient(var(--gold) 0 25%, #0a0a0a 0 50%) 0 0 / 20px 20px;
    border-top: 2px solid var(--gold-dark); border-bottom: 2px solid var(--gold-dark); margin: 0 auto 12px; max-width: 1200px; opacity: .95; }
  .checker.foot { margin: 16px auto 0; }
  .temple { display: grid; grid-template-columns: clamp(36px, 4.6vw, 60px) minmax(0, 1fr) clamp(36px, 4.6vw, 60px); gap: 12px; }
  .temple .center { min-width: 0; }
  .pillar { display: flex; flex-direction: column; filter: drop-shadow(0 0 14px rgba(212,175,55,.25)); }
  .pillar .cap, .pillar .plinth { margin: 0 -5px; background: linear-gradient(180deg, var(--gold-light), var(--gold) 50%, var(--gold-dark));
    border-radius: 5px; position: relative; }
  .pillar .cap { height: 34px; display: flex; align-items: center; justify-content: center; border-bottom: 4px solid #5a4510; }
  .pillar .cap span { font-family: Copperplate, Georgia, serif; font-weight: 900; color: #120d00; font-size: 1.25rem; }
  .pillar .cap::before { content: ""; position: absolute; left: 12%; right: 12%; top: -7px; height: 9px; border-radius: 99px 99px 0 0;
    background: radial-gradient(circle at 50% 100%, var(--gold-light), var(--gold-dark)); }
  .pillar .shaft { flex: 1; margin: 0 2px; background: repeating-linear-gradient(90deg, #4a390e 0 2px, var(--gold-dark) 2px 5px, var(--gold) 5px 9px, var(--gold-light) 9px 11px, var(--gold) 11px 14px, #4a390e 14px 16px); }
  .pillar .plinth { height: 22px; border-top: 4px solid #5a4510; }
  .orn { display: flex; align-items: center; gap: 12px; justify-content: center; color: var(--gold); margin: 8px 0 14px; }
  .orn::before, .orn::after { content: ""; height: 1px; width: 70px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .orn::after { transform: scaleX(-1); }
  .orn svg { width: 22px; height: 22px; }
  .emblem { display: block; width: 110px; margin: 0 auto 4px; filter: drop-shadow(0 0 18px rgba(212,175,55,.45)); }
  .lodge-line { text-align: center; color: var(--gold); letter-spacing: .22em; font-size: .8rem; text-transform: uppercase; margin: 0; }
  .modal { position: relative; padding-top: calc(clamp(14px, 3vw, 30px) + 22px); }
  .modal::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 16px;
    background: repeating-conic-gradient(var(--gold) 0 25%, #0a0a0a 0 50%) 0 0 / 16px 16px; border-bottom: 2px solid var(--gold-dark); }
  .modal::after { content: "✦"; position: absolute; top: 4px; left: 50%; transform: translateX(-50%); background: #0a0803; color: var(--gold-light);
    padding: 0 10px; line-height: 16px; font-size: .9rem; }
  .cat { box-shadow: inset 0 0 0 2px rgba(18,13,0,.35), 0 2px 10px rgba(212,175,55,.2); }

  .eye-wrap { text-align: center; padding-top: 10px; }
  .eye { width: clamp(46px, 7vw, 70px); height: auto; filter: drop-shadow(0 0 16px rgba(212,175,55,.55)); }
  header.top { padding-top: 2px; }
  .lodge-line { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .lodge-line .sm { display: inline-flex; width: 20px; height: 20px; color: var(--gold-light); }
  .lodge-line .sm svg { width: 100%; height: 100%; }
  .crest { display: block; width: clamp(110px, 18vw, 150px); margin: 8px auto 0; filter: drop-shadow(0 0 20px rgba(212,175,55,.4)); }

  /* ---------- Online play ---------- */
  .or-line { text-align: center; color: #8f8359; font-size: .8rem; letter-spacing: .2em; text-transform: uppercase; margin: 18px 0 10px; }
  .room-code { font-family: Copperplate, Georgia, serif; font-size: clamp(3rem, 12vw, 6rem); letter-spacing: .25em; text-align: center; margin: 4px 0; padding-left: .25em; }
  .join-link { word-break: break-all; text-align: center; color: var(--gold-light); font-size: .9rem; background: #000; border: 1px dashed var(--gold-dark); border-radius: 8px; padding: 8px; }
  .plist { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0; }
  .chip { background: var(--panel); border: 1px solid var(--gold-dark); border-radius: 999px; padding: 6px 14px; color: var(--gold-light); font-size: .95rem; }
  .chip.off { opacity: .45; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--green); margin-right: 6px; }
  .dot.off { background: #666; }
  .pv { max-width: 520px; margin: 0 auto; padding: 0 14px 30px; text-align: center; }
  .pv .me { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 2px solid var(--gold-dark);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
  .pv .me.control { border-color: var(--gold-light); box-shadow: 0 0 20px rgba(246,220,130,.3); }
  .pv .me .nm { color: var(--gold); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .pv .me .sc { font-family: Copperplate, Georgia, serif; font-size: 1.8rem; color: var(--gold-light); }
  .pv .me .sc.neg { color: #ff8a7a; }
  .pv .clue { font-size: clamp(1.1rem, 5.5vw, 1.7rem); margin: 14px 0; }
  .status { font-size: 1.15rem; color: var(--gold-light); margin: 12px 0; min-height: 1.6em; letter-spacing: .04em; }
  .status.hot { color: #fff; background: rgba(212,175,55,.2); border: 1px solid var(--gold); border-radius: 10px; padding: 10px; }
  .status.out { color: #ff8a7a; }
  .buzz { width: min(70vw, 280px); aspect-ratio: 1; border-radius: 50%; border: 6px solid var(--gold-dark); margin: 10px auto;
    background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 55%, var(--gold-dark)); color: #120d00;
    font-family: Copperplate, Georgia, serif; font-size: 2.6rem; font-weight: 900; letter-spacing: .1em; display: block;
    box-shadow: 0 0 40px rgba(212,175,55,.45), inset 0 -8px 20px rgba(0,0,0,.3); touch-action: manipulation; }
  .buzz:active:not([disabled]) { transform: scale(.96); }
  .buzz[disabled] { background: radial-gradient(circle at 35% 30%, #4a4a4a, #222); color: #777; border-color: #333; box-shadow: none; cursor: not-allowed; }
  .pv .board.mini .tile { min-height: 44px; font-size: 1rem; }
  .pv .board.mini .cat { min-height: 46px; font-size: .5rem; letter-spacing: 0; padding: 4px 1px; }
  .pv .scores { margin-top: 18px; }
  .pv .team { flex: 1 1 120px; padding: 6px 8px; }
  .waiting, .buzzed { font-size: 1.2rem; color: var(--gold-light); margin: 10px 0; }
  .buzzed { color: #fff; }
  .dd-player { color: var(--gold-light); }
  @media (max-width: 760px) {
    .temple { grid-template-columns: minmax(0, 1fr); } .pillar { display: none; }
  }
  @media (max-width: 560px) {
    .board { gap: 3px; }
    .lodge-line { letter-spacing: .08em; font-size: .62rem; gap: 6px; }
    .lodge-line .sm { width: 16px; height: 16px; }
    .tagline { letter-spacing: .1em; font-size: .62rem; }
    .orn::before, .orn::after { width: 24px; }
    .cat { font-size: .46rem; letter-spacing: 0; padding: 6px 2px; }
    .top-tools { position: static; justify-content: center; margin-bottom: 6px; }
    header.top { flex-direction: column; gap: 6px; }
    .field label { width: 56px; font-size: .75rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="goldMetal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff6c2"/><stop offset=".22" stop-color="#f2d268"/><stop offset=".48" stop-color="#b98a22"/>
    <stop offset=".72" stop-color="#e9c64f"/><stop offset="1" stop-color="#6f5112"/></linearGradient>
  <linearGradient id="gmLight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset="1" stop-color="#d9ae3a"/></linearGradient>
  <linearGradient id="gmDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8861f"/><stop offset="1" stop-color="#6a4d10"/></linearGradient>
  <radialGradient id="goldRadial" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff6c2"/><stop offset=".45" stop-color="#d9ae3a"/><stop offset="1" stop-color="#6a4d10"/></radialGradient>
  <radialGradient id="darkDisc" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#2b210a"/><stop offset="1" stop-color="#050402"/></radialGradient>
  <radialGradient id="sclera" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fffaf0"/><stop offset=".7" stop-color="#e6d8ae"/><stop offset="1" stop-color="#a88a45"/></radialGradient>
  <radialGradient id="iris" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f6cf5a"/><stop offset=".5" stop-color="#b9781a"/><stop offset="1" stop-color="#3a1f06"/></radialGradient>
  <filter id="gShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#000" flood-opacity=".8"/></filter>
</defs></svg>
<div id="app"></div>

<script src="peerjs.min.js"></script>
<script>
/* =====================================================================
   QUESTION BANK  — edit freely!
   Each category has five clues worth $100 to $500.
   Keep it to public, non-secret Masonic education (history, famous
   Brethren, symbols that are published openly, lodge basics).
   Answers are phrased as questions, Jeopardy style.
   ===================================================================== */
const CATEGORIES = [
  { name: "Famous Brethren", clues: [
    { q: "This first U.S. president was raised a Master Mason in Fredericksburg, Virginia, in 1753.", a: "Who is George Washington?" },
    { q: "This Founding Father, inventor and printer was Provincial Grand Master of Pennsylvania in 1734.", a: "Who is Benjamin Franklin?" },
    { q: "This Boston silversmith of the famous midnight ride served as Grand Master of Massachusetts in the 1790s.", a: "Who is Paul Revere?" },
    { q: "This wartime British Prime Minister was initiated into Studholme Lodge in 1901.", a: "Who is Winston Churchill?" },
    { q: "This U.S. president served as Grand Master of Missouri in 1940-41, before reaching the White House.", a: "Who is Harry S. Truman?" }
  ]},
  { name: "Tools & Symbols", clues: [
    { q: "The square and compasses are most often shown with this letter in the center.", a: "What is G?" },
    { q: "The beehive is a Masonic symbol of this hardworking insect's industry and cooperation.", a: "What is the bee?" },
    { q: "Operative masons spread cement with this tool; Masons today use it as a symbol of brotherly affection.", a: "What is the trowel?" },
    { q: "The Volume of the Sacred Law, the Square and this instrument make up the Three Great Lights.", a: "What are the Compasses?" },
    { q: "A Mason's apron is traditionally made from the skin of this young animal, a symbol of innocence.", a: "What is a lamb (lambskin)?" }
  ]},
  { name: "Masonic History", clues: [
    { q: "In this year, four London lodges formed the first Grand Lodge of England.", a: "What is 1717?" },
    { q: "This Scottish-born minister published the Constitutions of the Free-Masons in 1723.", a: "Who is James Anderson?" },
    { q: "He was the very first Grand Master of the first Grand Lodge, elected in 1717.", a: "Who is Anthony Sayer?" },
    { q: "In 1813 the \"Antients\" united with these rivals to form the United Grand Lodge of England.", a: "Who are the \"Moderns\"?" },

/* =====================================================================
   ONLINE PLAY  (host screen + player phones, peer-to-peer via PeerJS)
   The host screen is the referee: the first BUZZ message to reach it wins.
   ===================================================================== */
const MAX_PLAYERS = 10;
let NET = { role: null, peer: null, conns: {}, conn: null, state: null, joined: false, code: null, name: "", err: "" };

function peerOpts() {
  const q = new URLSearchParams(location.search);
  if (q.get("peerhost")) return { host: q.get("peerhost"), port: +q.get("peerport") || 9000, path: q.get("peerpath") || "/", secure: false };
  return {};
}
function newRoomCode() { const L = "BCDFGHJKLMNPQRSTVWXZ"; return Array.from({ length: 4 }, () => L[rand(0, L.length - 1)]).join(""); }
function closeNet() {
  try { if (NET.peer) NET.peer.destroy(); } catch (e) {}
  NET = { role: null, peer: null, conns: {}, conn: null, state: null, joined: false, code: null, name: "", err: "" };
}
function myPid() {
  let id = null;
  try { id = sessionStorage.getItem("masonicJeopardy.pid"); } catch (e) {}
  if (!id) { id = "p" + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem("masonicJeopardy.pid", id); } catch (e) {} }
  return id;
}

/* ----- host side ----- */
function hostOnline() {
  if (!window.Peer) { alert("The online play library did not load. Check your connection and try again."); return; }
  closeNet(); NET.role = "host"; NET.code = newRoomCode();
  S = { phase: "lobby", mode: "online", teams: [], control: 0, used: {}, dd: `${rand(0, CATEGORIES.length - 1)}-${rand(1, 4)}`, final: null, room: NET.code };
  modal = null; openHostPeer(); render();
}
function openHostPeer() {
  const peer = new Peer("mjeop-" + NET.code, peerOpts());
  NET.peer = peer;
  peer.on("open", () => { NET.err = ""; render(); });
  peer.on("error", err => {
    if (err.type === "unavailable-id") { NET.code = newRoomCode(); S.room = NET.code; try { peer.destroy(); } catch (e) {} openHostPeer(); return; }
    NET.err = "Connection trouble: " + (err.type || err.message); render();
  });
  peer.on("disconnected", () => { try { peer.reconnect(); } catch (e) {} });
  peer.on("connection", conn => {
    conn.on("data", m => handleNetMsg(conn, m));
    conn.on("close", () => { if (conn.pid) { const t = S.teams.find(x => x.pid === conn.pid); if (t && NET.conns[conn.pid] === conn) { t.online = false; delete NET.conns[conn.pid]; render(); } } });
  });
}
function uniqueName(n) {
  n = (n || "Player").trim().slice(0, 16) || "Player";
  let out = n, k = 2;
  while (S.teams.some(t => t.name.toLowerCase() === out.toLowerCase())) out = n + " " + k++;
  return out;
}
function handleNetMsg(conn, m) {
  if (!m || !S || NET.role !== "host") return;
  if (m.t === "join") {
    let t = S.teams.find(x => x.pid === m.pid);
    if (!t) {
      if (S.teams.length >= MAX_PLAYERS) { conn.send({ t: "full" }); return; }
      t = { name: uniqueName(m.name), score: 0, pid: m.pid }; S.teams.push(t);
    }
    t.online = true; conn.pid = m.pid; NET.conns[m.pid] = conn;
    conn.send({ t: "welcome", pid: m.pid, name: t.name });
    save(); render(); return;
  }
  const i = S.teams.findIndex(x => x.pid === conn.pid);
  if (i < 0) return;
  if (m.t === "buzz") {
    if (modal && modal.stage === "clue" && !modal.done && !modal.dd && modal.buzz && modal.buzz.by == null && !modal.locked.includes(i)) {
      modal.buzz.by = i; sfx.buzz(); render();
    }
  } else if (m.t === "pick") {
    const key = `${m.c}-${m.r}`;
    if (S.phase === "board" && !modal && i === S.control && CATEGORIES[m.c] && !S.used[key]) openClue(m.c, m.r);
  }
}
function publicState() {
  const s = { phase: S.phase, room: S.room, teams: S.teams.map(t => ({ name: t.name, score: t.score, pid: t.pid, online: t.online !== false })),
    control: S.teams[S.control] ? S.teams[S.control].pid : null, used: S.used, cats: CATEGORIES.map(c => c.name), values: VALUES };
  if (modal) {
    const cl = CATEGORIES[modal.c].clues[modal.r];
    s.clue = { cat: CATEGORIES[modal.c].name, value: modal.stage === "clue" && modal.dd ? modal.value : VALUES[modal.r], dd: modal.dd, stage: modal.stage,
      done: modal.done, q: modal.stage === "clue" ? cl.q : null, a: modal.revealed ? cl.a : null,
      by: modal.buzz && modal.buzz.by != null && S.teams[modal.buzz.by] ? S.teams[modal.buzz.by].pid : null,
      locked: modal.locked.map(i => S.teams[i].pid) };
  }
  if ((S.phase === "final" || S.phase === "done") && S.final) {
    const st = S.final.stage;
    s.final = { stage: st, cat: FINAL.category, q: st !== "wager" ? FINAL.q : null, a: st === "judge" ? FINAL.a : null };
  }
  return s;
}
function broadcast() {
  if (NET.role !== "host") return;
  const msg = { t: "state", s: publicState() };
  Object.values(NET.conns).forEach(c => { try { if (c.open) c.send(msg); } catch (e) {} });
}
function startOnline() {
  if (S.teams.length < 2) return;
  S.phase = "board"; S.control = 0; modal = null; save(); render();
}

/* ----- player side ----- */
function joinOnline(code, name) {
  if (!window.Peer) { NET.err = "The online play library did not load."; render(); return; }
  closeNet(); NET.role = "player"; NET.code = code.toUpperCase().trim(); NET.name = name.trim().slice(0, 16); NET.err = ""; NET.joined = false;
  const peer = new Peer(undefined, peerOpts()); NET.peer = peer;
  peer.on("open", () => connectToHost());
  peer.on("error", err => {
    NET.err = err.type === "peer-unavailable" ? "No game found with that room code." : "Connection trouble: " + (err.type || err.message);
    NET.joined = false; render();
  });
  render();
}
function connectToHost() {
  if (!NET.peer || NET.peer.destroyed) return;
  const conn = NET.peer.connect("mjeop-" + NET.code, { reliable: true });
  NET.conn = conn;
  conn.on("open", () => conn.send({ t: "join", pid: myPid(), name: NET.name }));
  conn.on("data", m => {
    if (m.t === "welcome") { NET.joined = true; NET.name = m.name; NET.err = ""; }
    else if (m.t === "full") { NET.err = "This game is full (10 players)."; NET.joined = false; closeConnOnly(); }
    else if (m.t === "state") { NET.state = m.s; }
    render();
  });
  conn.on("close", () => { if (NET.role === "player" && NET.joined) { NET.err = "Disconnected from the host. Reconnecting…"; render(); setTimeout(connectToHost, 2000); } });
}
function closeConnOnly() { try { if (NET.conn) NET.conn.close(); } catch (e) {} }

/* Faceted five-point star: alternating light/dark facets give a beveled, engraved look */
function starSVG() {

  }

/* Square and Compasses: tapered metal legs, pivot rivet, graduated square, shaded like polished gold */

  }
  return `<g filter="url(#gShadow)">
    <polygon points="${pts([A, O, I, B, I2, O2])}" fill="url(#goldMetal)" stroke="#3d2d08" stroke-width="1" stroke-linejoin="round"/>
    <polyline points="${pts([I, B, I2])}" fill="none" stroke="#fff6c2" stroke-width="1" opacity=".75"/>
    <polyline points="${pts([O, A, O2])}" fill="none" stroke="#5a4210" stroke-width="1.2" opacity=".7"/>
    <g stroke="#3d2d08" stroke-width=".7" opacity=".85">${ticks}</g>
    ${leg(46, 178)}${leg(154, 178)}
    <path d="M67.5 120 Q100 138 132.5 120" fill="none" stroke="#3d2d08" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M67.5 120 Q100 138 132.5 120" fill="none" stroke="url(#goldMetal)" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="100" cy="9" r="5.4" fill="none" stroke="#3d2d08" stroke-width="3.6"/><circle cx="100" cy="9" r="5.4" fill="none" stroke="url(#goldMetal)" stroke-width="2.2"/>
    <circle cx="100" cy="26" r="12.5" fill="url(#goldRadial)" stroke="#3d2d08" stroke-width="1"/>
    <circle cx="100" cy="26" r="8" fill="none" stroke="#7a5a14" stroke-width="1"/>
    <circle cx="100" cy="26" r="3.4" fill="url(#goldMetal)" stroke="#3d2d08" stroke-width=".7"/>
    <circle cx="100" cy="100" r="17.5" fill="url(#darkDisc)" stroke="#3d2d08" stroke-width="3.4"/>
    <circle cx="100" cy="100" r="17.5" fill="none" stroke="url(#goldMetal)" stroke-width="2.2"/>
    <text x="100" y="108.5" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="25" font-weight="700" fill="url(#goldMetal)" stroke="#3d2d08" stroke-width=".4">G</text>
  </g>`;
}
const LOGO = `<svg viewBox="0 0 200 200" aria-hidden="true">${emblemInner()}</svg>`;
const CREST = `<svg class="crest" viewBox="0 0 200 200" aria-label="Elgin Lodge No. 117 seal">
  <defs><path id="crestRing" d="M100 100 m-74 0 a74 74 0 1 1 148 0 a74 74 0 1 1 -148 0"/></defs>
  <circle cx="100" cy="100" r="95" fill="url(#goldMetal)" stroke="#3d2d08" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="88" fill="url(#darkDisc)" stroke="#3d2d08" stroke-width="1.2"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#goldMetal)" stroke-width="1.2"/>
  <circle cx="100" cy="100" r="57" fill="none" stroke="url(#goldMetal)" stroke-width="2"/>
  <text font-family="Georgia,serif" font-size="15" font-weight="700" letter-spacing="3.2" fill="url(#goldMetal)"><textPath href="#crestRing">ELGIN LODGE No. 117 · A.F. &amp; A.M. ·</textPath></text>
  <g transform="translate(46 46) scale(.54)">${emblemInner()}</g>
</svg>`;

/* ---------- audio ---------- */
let actx = null;
function tone(freq, dur, type = "sine", when = 0, vol = .15) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    const t = actx.currentTime + when;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  open: () => { tone(440, .12, "triangle"); tone(660, .18, "triangle", .1); },
  right: () => { tone(523, .15, "triangle"); tone(659, .15, "triangle", .12); tone(784, .3, "triangle", .24); },
  wrong: () => { tone(160, .45, "sawtooth", 0, .12); },
  buzz: () => { tone(880, .12, "square", 0, .12); tone(1175, .2, "square", .1, .1); },
  dd: () => { [392, 523, 659, 784, 1046].forEach((f, i) => tone(f, .2, "square", i * .1, .08)); },
  win: () => { [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, .25, "triangle", i * .14, .12)); }
};

/* ---------- persistence ---------- */
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
function loadSaved() { try { const r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function clearSaved() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }

/* ---------- state ---------- */
function clueCount() { return Object.keys(S.used).length; }
const totalClues = () => CATEGORIES.length * VALUES.length;

/* ---------- rendering ---------- */
function header() {
  return `<div class="eye-wrap">${EYE}</div><header class="top">${LOGO}<h1 class="gold-text">Masonic Jeopardy</h1>${LOGO}
    <div class="top-tools">
      <button class="icon-btn" data-act="mute" aria-label="Toggle sound">${muted ? "🔇 Sound off" : "🔊 Sound on"}</button>
      ${S && S.phase !== "setup" ? `<button class="icon-btn" data-act="newgame">New Game</button>` : ""}
    </div></header>
    <p class="lodge-line"><span class="sm">${SUN}</span> Elgin Lodge No. 117 · A.F. &amp; A.M. <span class="sm">${MOON}</span></p>
    <div class="orn">${STAR}<span class="tagline" style="margin:0">Light · Learning · Brotherhood</span>${STAR}</div>
    <div class="checker"></div>`;
}

function render() {
  if (NET.role === "player") { renderPlayer(); return; }
  if (NET.role === "join") { renderJoin(); return; }
  if (!S) { renderSetup(); return; }
  if (S.phase === "lobby") renderLobby();
  else if (S.phase === "board") renderBoard();
  else if (S.phase === "final" || S.phase === "done") renderBoard(); // board stays behind the final modal
  broadcast();
}

function renderSetup() {
  $app.innerHTML = `${header()}
  <div class="setup"><div class="card" style="text-align:center">
    ${LOGO.replace("<svg ", '<svg class="emblem" ')}
    <h2>Welcome to the Lodge</h2>
    <p class="sub">One screen hosts the game. Everyone else joins from their own phone with a room code, up to 10 players.</p>
    <div class="row-actions" style="justify-content:center;flex-direction:column;align-items:stretch">
      <button class="btn" data-act="hostonline">Host a Game</button>
      <button class="btn ghost" data-act="joinform">Join with a Room Code</button>
    </div>
    <p class="note">Questions use publicly available Masonic history, symbolism and lodge basics only. Nothing esoteric or ritual.</p>
  </div></div>`;
}

function renderBoard() {
  const cells = [];
  CATEGORIES.forEach((c, ci) => cells.push(`<div class="cat">${esc(c.name)}</div>`));
  VALUES.forEach((v, ri) => CATEGORIES.forEach((c, ci) => {
    const key = `${ci}-${ri}`;
    cells.push(`<button class="tile" data-act="clue" data-c="${ci}" data-r="${ri}" ${S.used[key] ? "disabled" : ""}
      aria-label="${esc(c.name)} for $${v}">$${v}</button>`);
  }));

  const teams = S.teams.map((t, i) => `
    <div class="team ${i === S.control ? "control" : ""}">
      ${i === S.control ? `<div class="ctl">PICKS NEXT</div>` : ""}
      <div class="tname">${S.mode === "online" ? `<span class="dot ${t.online === false ? "off" : ""}"></span>` : ""}${esc(t.name)}</div>
      <div class="tscore ${t.score < 0 ? "neg" : ""}">${money(t.score)}</div>
      <div class="adj"><button data-act="adj" data-t="${i}" data-d="-100" aria-label="Subtract 100 from ${esc(t.name)}">-100</button>
        <button data-act="adj" data-t="${i}" data-d="100" aria-label="Add 100 to ${esc(t.name)}">+100</button></div>
      ${i !== S.control ? `<div class="pick"><button data-act="control" data-t="${i}">give control</button></div>` : ""}
    </div>`).join("");

  const remaining = totalClues() - clueCount();
  $app.innerHTML = `${header()}
  <main class="game"><div class="temple">
    <div class="pillar" aria-hidden="true"><div class="cap"><span>B</span></div><div class="shaft"></div><div class="plinth"></div></div>
    <div class="center">
    <div class="board">${cells.join("")}</div>
    <div class="board-actions">
      <button class="btn ghost" data-act="final">${remaining === 0 ? "★ Final Question ★" : `Skip to Final Question (${remaining} left)`}</button>
    </div>
    <div class="scores">${teams}</div>
    </div>
    <div class="pillar" aria-hidden="true"><div class="cap"><span>J</span></div><div class="shaft"></div><div class="plinth"></div></div>
    </div>
    <div class="checker foot"></div>
  </main>${modalHTML()}`;
  if (modal && modal.stage === "clue" && !modal.done) updateTimerDOM();
}

function modalHTML() {
  if (S.phase === "final" || S.phase === "done") return finalHTML();
  if (!modal) return "";
  const cat = CATEGORIES[modal.c], clue = cat.clues[modal.r], team = S.teams[S.control];
  let body = "";

  if (modal.stage === "wager") {
    const maxW = Math.max(team.score, 500);
    body = `<div class="big-title gold-text">Daily Double!</div>
      <p><b>${esc(team.name)}</b>, how much will you wager?</p>
      <div class="wager-box"><input id="wager" type="number" min="5" max="${maxW}" step="5" value="${Math.min(maxW, Math.max(5, Math.floor(team.score / 2 / 5) * 5 || 500))}" aria-label="Wager">
      <div class="wager-hint">Wager up to ${money(maxW)}</div></div>
      <div class="modal-actions"><button class="btn" data-act="lockwager">Lock It In</button>
      <button class="btn ghost" data-act="cancelclue">Back to board</button></div>`;
  } else {
    let judge;
    if (modal.dd) judge = judgeTeam(S.control);
    else if (modal.buzz) judge = modal.buzz.by != null
      ? `<div class="buzzed" style="width:100%">🔔 <b>${esc(S.teams[modal.buzz.by].name)}</b> buzzed in!</div>${judgeTeam(modal.buzz.by)}`
      : `<div class="waiting" style="width:100%">Buzzers are open. Waiting for a player…</div>`;
    else judge = S.teams.map((_, i) => judgeTeam(i)).join("");
    body = `<div class="clue">${esc(clue.q)}</div>
      ${modal.done ? "" : `<div class="timer"><div id="timerbar"></div></div><div class="timer-label" id="timerlabel"></div>`}
      ${modal.revealed ? `<div class="answer">${esc(clue.a)}</div>` : ""}
      ${modal.msg ? `<div class="scoremsg ${modal.msgOk ? "ok" : "no"}" role="status">${esc(modal.msg)}</div>` : ""}
      ${modal.done ? "" : `<div class="judge">${judge}</div>`}
      <div class="modal-actions">
        ${modal.done
          ? `${modal.snap ? `<button class="btn ghost" data-act="undo">Undo Last Score</button>` : ""}<button class="btn" data-act="closeclue">Back to Board</button>`
          : `${modal.revealed ? "" : `<button class="btn ghost" data-act="reveal">Reveal Answer</button>`}
             ${modal.snap ? `<button class="btn ghost" data-act="undo">Undo Last Score</button>` : ""}
             ${!modal.touched ? `<button class="btn ghost" data-act="cancelclue">Return Clue to Board</button>` : ""}`}
      </div>`;
  }

  return `<div class="overlay" role="dialog" aria-modal="true"><div class="modal">
    <div class="m-head"><span>${esc(cat.name)} · ${modal.dd && modal.stage === "clue" ? money(modal.value) : "$" + VALUES[modal.r]}</span>
    ${modal.dd ? `<span class="dd-badge">DAILY DOUBLE</span>` : ""}</div>${body}</div></div>`;
}

function judgeTeam(i) {
  const locked = modal.locked.includes(i);
  return `<div class="jteam"><div class="jname">${esc(S.teams[i].name)}</div><div class="jbtns">
    <button class="btn good" data-act="right" data-t="${i}" ${locked ? "disabled" : ""} aria-label="${esc(S.teams[i].name)} correct">✓ Right</button>
    <button class="btn danger" data-act="wrong" data-t="${i}" ${locked ? "disabled" : ""} aria-label="${esc(S.teams[i].name)} incorrect">✗ Wrong</button></div></div>`;
}

/* ---------- timer ---------- */
function startTimer() {
  stopTimer(); modal.left = THINK_SECONDS;
  timerId = setInterval(() => {
    if (!modal || modal.done) { stopTimer(); return; }
    if (modal.left > 0) { modal.left--; updateTimerDOM(); }
    if (modal.left === 0) { stopTimer(); tone(220, .5, "square", 0, .1); }
  }, 1000);
}
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function updateTimerDOM() {
  const bar = document.getElementById("timerbar"), lab = document.getElementById("timerlabel");
  if (!bar || !modal) return;
  const left = modal.left == null ? THINK_SECONDS : modal.left;
  bar.style.width = (left / THINK_SECONDS * 100) + "%";
  if (lab) lab.textContent = left > 0 ? `${left}s` : "TIME!";
}

/* ---------- clue actions ---------- */
function openClue(c, r) {
  const key = `${c}-${r}`;
  if (S.used[key]) return;
  const dd = S.dd === key;
  modal = { c, r, key, dd, stage: dd ? "wager" : "clue", revealed: false, done: false, locked: [], touched: false, value: VALUES[r],
            buzz: S.mode === "online" && !dd ? { by: null } : null };
  if (dd) sfx.dd(); else sfx.open();
  render();
  if (!dd) startTimer();
}
function lockWager() {
  const team = S.teams[S.control], maxW = Math.max(team.score, 500);
  let w = parseInt(document.getElementById("wager").value, 10);
  if (isNaN(w) || w < 5) w = 5;
  if (w > maxW) w = maxW;
  modal.value = w; modal.stage = "clue"; render(); startTimer();
}
function judge(i, ok) {
  const t = S.teams[i];
  const now = Date.now();
  const key = i + ":" + ok;
  if (modal.lastKey === key && now - modal.lastJudge < 600) return;   // ignore accidental double-taps on the same button
  modal.lastKey = key; modal.lastJudge = now;
  modal.snap = { scores: S.teams.map(x => x.score), control: S.control, locked: [...modal.locked], revealed: modal.revealed, done: modal.done, by: modal.buzz ? modal.buzz.by : null };
  modal.msg = ok ? `${t.name}: +${money(modal.value)}` : `${t.name}: -${money(modal.value)}`;
  modal.msgOk = ok;
  modal.touched = true;
  if (ok) {
    t.score += modal.value; S.control = i; modal.revealed = true; modal.done = true; sfx.right(); stopTimer();
  } else {
    t.score -= modal.value; modal.locked.push(i); sfx.wrong();
    if (modal.dd || modal.locked.length === S.teams.length) { modal.revealed = true; modal.done = true; stopTimer(); }
  }
  if (modal.buzz) modal.buzz.by = null;   // after a verdict, buzzers reopen for anyone not locked out
  save(); render();
}
function undoJudge() {
  if (!modal || !modal.snap) return;
  const sn = modal.snap;
  S.teams.forEach((t, i) => t.score = sn.scores[i]);
  S.control = sn.control; if (modal.buzz) modal.buzz.by = sn.by; modal.locked = sn.locked; modal.revealed = sn.revealed; modal.done = sn.done;
  modal.snap = null; modal.msg = "Last score undone"; modal.msgOk = true;
  save(); render();
  if (!modal.done) startTimer();
}
function revealAnswer() { modal.revealed = true; modal.done = true; modal.touched = true; stopTimer(); save(); render(); }
function closeClue() { S.used[modal.key] = true; modal = null; stopTimer(); save(); render(); }
function cancelClue() { modal = null; stopTimer(); render(); }

/* ---------- final question ---------- */
function startFinal() {
  S.phase = "final";
  S.final = { stage: "wager", wagers: S.teams.map(() => 0), results: S.teams.map(() => null) };
  modal = null; stopTimer(); save(); render();
}
function finalHTML() {
  const F = S.final;
  if (S.phase === "done") {
    const top = Math.max(...S.teams.map(t => t.score));
    const winners = S.teams.filter(t => t.score === top);
    return `<div class="overlay"><div class="modal">
      <div class="m-head"><span>Final Standings</span><span></span></div>
      ${CREST}
      <div class="big-title gold-text">${winners.length > 1 ? "A Tie!" : "Well Done, Brother!"}</div>
      <div class="winner">${winners.map(w => esc(w.name)).join(" & ")} ${winners.length > 1 ? "share" : "wins with"} ${money(top)}</div>
      <div class="final-grid">${[...S.teams].sort((a, b) => b.score - a.score).map(t =>
        `<div class="fteam"><div class="jname" style="color:var(--gold)">${esc(t.name)}</div><div class="tscore gold-text" style="font-size:2rem">${money(t.score)}</div></div>`).join("")}</div>
      <div class="modal-actions"><button class="btn" data-act="newgame">Play Again</button></div></div></div>`;
  }
  const head = `<div class="m-head"><span>Final Question</span><span class="dd-badge">${esc(FINAL.category)}</span></div>`;
  if (F.stage === "wager") {
    return `<div class="overlay"><div class="modal">${head}
      ${CREST}
      <div class="big-title gold-text">${esc(FINAL.category)}</div>
      <p>Each team secretly wagers up to its score. Teams at $0 or below sit this one out.</p>
      <div class="final-grid">${S.teams.map((t, i) => `<div class="fteam"><div class="jname" style="color:var(--gold)">${esc(t.name)}</div>
        ${t.score > 0 ? `<div class="wager-hint">Max ${money(t.score)}</div>
        <input type="number" id="fw${i}" min="0" max="${t.score}" step="5" value="0" aria-label="${esc(t.name)} wager">`
        : `<div class="wager-hint">Not eligible</div>`}</div>`).join("")}</div>
      <div class="modal-actions"><button class="btn" data-act="finalclue">Show the Clue</button>
      <button class="btn ghost" data-act="finalback">Back to Board</button></div></div></div>`;
  }
  const done = S.teams.every((t, i) => t.score <= 0 || F.results[i] !== null);
  return `<div class="overlay"><div class="modal">${head}
    <div class="clue">${esc(FINAL.q)}</div>
    ${F.stage === "judge" ? `<div class="answer">${esc(FINAL.a)}</div>` : ""}
    ${F.stage === "clue" ? `<div class="modal-actions"><button class="btn" data-act="finalreveal">Reveal Answer</button></div>` : `
      <div class="final-grid">${S.teams.map((t, i) => t.score <= 0
        ? `<div class="fteam"><div class="jname" style="color:var(--gold)">${esc(t.name)}</div><div class="wager-hint">Sat out</div></div>`
        : `<div class="fteam"><div class="jname" style="color:var(--gold)">${esc(t.name)}</div>
          <div class="wager-hint">Wagered ${money(F.wagers[i])}</div>
          ${F.results[i] === null
            ? `<div class="jbtns" style="margin-top:8px"><button class="btn good" data-act="fright" data-t="${i}" aria-label="${esc(t.name)} correct">✓</button>
               <button class="btn danger" data-act="fwrong" data-t="${i}" aria-label="${esc(t.name)} incorrect">✗</button></div>`
            : `<div class="tag ${F.results[i] ? "ok" : "no"}" style="margin-top:8px">${F.results[i] ? "Correct" : "Incorrect"}</div>`}
        </div>`).join("")}</div>
      <div class="modal-actions"><button class="btn" data-act="finish" ${done ? "" : "disabled"}>See Final Standings</button></div>`}
  </div></div>`;
}
function finalClue() {
  S.final.wagers = S.teams.map((t, i) => {
    if (t.score <= 0) return 0;
    const el = document.getElementById("fw" + i);
    let w = parseInt(el && el.value, 10);
    if (isNaN(w) || w < 0) w = 0;
    return Math.min(w, t.score);
  });
  S.final.stage = "clue"; save(); render();
}
function finalJudge(i, ok) {
  const F = S.final;
  F.results[i] = ok;
  S.teams[i].score += ok ? F.wagers[i] : -F.wagers[i];
  ok ? sfx.right() : sfx.wrong();
  save(); render();
}
function finish() {
  S.phase = "done"; save(); render(); sfx.win(); sparkle();
}
function sparkle() {
  for (let i = 0; i < 60; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (2 + Math.random() * 3) + "s";
    s.style.animationDelay = (Math.random() * 1.5) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6500);
  }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, t = parseInt(el.dataset.t, 10);
  switch (act) {
    case "hostonline": hostOnline(); break;
    case "joinform": closeNet(); NET.role = "join"; render(); break;
    case "joinsubmit": {
      const code = document.getElementById("jc").value.trim(), nm = document.getElementById("jn").value.trim();
      if (code.length !== 4 || !nm) { NET.err = "Enter the 4-letter code and your name."; NET.role = "join"; renderJoin(); break; }
      joinOnline(code, nm); break;
    }
    case "startonline": startOnline(); break;
    case "leaveonline": closeNet(); if (S && S.mode === "online") { S = null; clearSaved(); } history.replaceState(null, "", location.pathname); render(); break;
    case "buzz": if (NET.conn && NET.conn.open) { NET.conn.send({ t: "buzz" }); if (navigator.vibrate) navigator.vibrate(60); } break;
    case "ppick": if (NET.conn && NET.conn.open) NET.conn.send({ t: "pick", c: parseInt(el.dataset.c, 10), r: parseInt(el.dataset.r, 10) }); break;
    case "newgame":
      if (S && S.phase === "done" || confirm("Start a new game? Current scores will be lost.")) {
        clearSaved(); closeNet(); S = null; modal = null; stopTimer(); render();
      }
      break;
    case "mute":
      muted = !muted;
      try { localStorage.setItem("masonicJeopardy.muted", muted ? "1" : "0"); } catch (err) {}
      render(); break;
    case "clue": openClue(parseInt(el.dataset.c, 10), parseInt(el.dataset.r, 10)); break;
    case "lockwager": lockWager(); break;
    case "right": judge(t, true); break;
    case "wrong": judge(t, false); break;
    case "reveal": revealAnswer(); break;
    case "undo": undoJudge(); break;
    case "closeclue": closeClue(); break;
    case "cancelclue": cancelClue(); break;
    case "adj": S.teams[t].score += parseInt(el.dataset.d, 10); save(); render(); break;
    case "control": S.control = t; save(); render(); break;
    case "final": startFinal(); break;
    case "finalback": S.phase = "board"; S.final = null; save(); render(); break;
    case "finalclue": finalClue(); break;
    case "finalreveal": S.final.stage = "judge"; save(); render(); break;
    case "fright": finalJudge(t, true); break;
    case "fwrong": finalJudge(t, false); break;
    case "finish": finish(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modal && !modal.touched && modal.stage !== "done") cancelClue();
  if (e.key === "Enter" && modal && modal.stage === "wager" && document.activeElement && document.activeElement.id === "wager") lockWager();
});

(function boot() {
  const room = new URLSearchParams(location.search).get("room");
  if (room) { NET.role = "join"; NET.code = room.toUpperCase().slice(0, 4); }
  render();
})();
</script>
</body>
</html>
